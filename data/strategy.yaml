# Draft Copilot tuning. Every knob the engine uses lives here, not in code.

roster:
  starters: {QB: 1, RB: 2, WR: 2, TE: 1, DST: 1}
  flex: {count: 2, eligible: [RB, WR, TE]}
  bench: 8
  total_spots: 17
  max: {QB: 4, RB: 9, WR: 8, TE: 3, DST: 3}
  # No kicker slot in this league.

# League mechanics that are not scoring or strategy: how the room runs. Read at boot, so
# changing one is a restart, not a rebuild — which is the point on draft night when the
# commissioner announces the clock is 2 minutes, not 90 seconds.
draft:
  seconds_per_pick: 90      # the clock each team gets; drives the countdown in the UI
  clock_warn_seconds: 20    # the countdown turns urgent at or below this

scoring:
  reception: 1.0          # full PPR
  te_premium: 0.0

objective:
  variance_preference: 0.15   # >0 favors ceiling; 8/12 teams make a 1-week bracket
  keeper_horizon_bonus: 0.05  # tiebreak toward youth; 2 keepers again in 2027

adp:
  # Per-source weights for the weighted median that becomes ADPMean.
  # sigma: true means the source participates in the σ (MAD) calculation.
  # Best-ball spread is format noise, not real disagreement, so it is excluded from σ.
  sources:
    ESPN:          {weight: 1.0, sigma: true}
    CBS:           {weight: 1.0, sigma: true}
    NFFC:          {weight: 1.0, sigma: true}
    RT Sports:     {weight: 1.0, sigma: true}
    Yahoo!:        {weight: 1.0, sigma: true}
    FFPC:          {weight: 1.0, sigma: true, pos_weight: {TE: 0.3}}   # TE premium inflates TE ADP
    Sleeper 1QB:   {weight: 0.7, sigma: true}
    MFL:           {weight: 0.7, sigma: true}
    FBG OC:        {weight: 0.7, sigma: true}   # sharp 1QB redraft pool; good QB-timing signal
    Underdog:      {weight: 0.4, sigma: false}
    Drafters:      {weight: 0.4, sigma: false}
    BestBall10s:   {weight: 0.4, sigma: false}
    DraftKings:    {weight: 0.4, sigma: false}
    # Excluded entirely: Sleeper SF*, *Rookie, *IDP* (superflex/rookie/IDP formats).
  min_sources: 3            # fewer weighted sources than this -> thin-data fallback
  sigma_floor: 3.0          # picks; a player every site agrees on still has draft-day variance
  sigma_mad_scale: 1.4826   # MAD -> σ for a normal distribution
  thin_sigma: {min: 12.0, frac: 0.15}   # σ = max(min, frac × ADPMean) when data is thin
  pos_map: {TD: DST, PK: K, CB: WR, DEF: DST, D/ST: DST}   # CB: Travis Hunter is a WR here

engine:
  sims: 2000
  candidate_pool: 40          # top-N by noisy ADP each opposing pick draws from
  lambda_rank: 0.25           # w = exp(-λ_rank × rank): steepness of BPA preference
  lambda_regret: 1.0          # score = VOR + λ_regret × regret
  survive_threshold: 0.5      # fallback = best at pos with p_survive > this
  # Opponent positional-need multipliers, derived from each team's live roster
  # (keepers included). Modest on purpose: managers reach and go BPA.
  need:
    starter_open: 1.8         # a required starter slot at this position is unfilled
    flex_open: 1.25           # position is flex-eligible and a flex slot is unfilled
    full: 0.6                 # starters + flex share satisfied; only bench value left
    at_max: 0.0               # position max reached
    # 13, not 15: pooled 2023-25 boards show DST at ~0% through round 12, then 43% of
    # round 13, 19% of 14, 17% of 15. At 15 the engine treated defences as unavailable
    # exactly while the room was taking them fastest. See data/draft-20*.json.
    dst_before_round: 13      # opponents essentially never take DST before this round
    dst_early_mult: 0.05
  flex_share: {RB: 0.45, WR: 0.45, TE: 0.10}   # how flex demand splits by position in PPR
  # VOR multiplier when a pick can only be bench for MY roster (starters + flex already
  # covered at that position). League replacement level says a QB2 is worth +20; my
  # lineup says it starts only if QB1 is hurt. Unlisted positions are undiscounted.
  bench_discount: {QB: 0.05, DST: 0.0}
  # A backup QB is a wasted pick in round 7 and bye insurance in round 15 — same player,
  # different cost. So the discount relaxes only in the endgame. Swept 2026-08-29 over 500
  # drafts: unfillable bye weeks 2.01 -> 1.60 with the paired median unchanged at +40.
  # QB 0.60 bought only 0.08 more for another 0.6pp of win rate, so 0.35 is the knee.
  # DST stays 0 at every round: a second defence scores ~0 VOR at any multiplier, because
  # the DST waiver level IS the next defence you would take.
  bench_late_round: 13
  bench_discount_late: {QB: 0.35}
  bench_decay: 0.75  # k-th bench player at a position is worth decay^k of the first

gates:
  - position: QB
    must_draft_by_live_pick: 68
    max: 2
    rationale: "0 QBs kept; 12 teams × 1 QB. QB12 by ADP is ~Stafford/Purdy."
  - position: TE
    must_draft_by_live_pick: 65
    max: 2
    # Deadlines are quantised to MY live picks, so anything in [49,64] is the same gate.
    # 65 is the last of my picks before the tier is gone; 68 is the QB gate's own last
    # chance, and two gates cannot share one pick. Swept 2026-08-28: 49 -> 65 is worth
    # +6 paired median and +4pp win rate (docs/gate-sweep-2026-08-28.md).
    rationale: "Bowers/Loveland/Warren kept. #65 is my last pick before the Kraft/Pitts/Fannin tier is gone."
  - position: DST
    exactly: 1
    not_before_round: 16
    rationale: "One slot, no kicker. Only mandatory endgame pick."
  - position: RB
    min_count_by_live_pick: {26: 2}
    rationale: "10 RBs kept. Two startable RBs by end of round 3 or you stream all year."

# Keeper economics (spec §14). Rounds 8–17 cost the same to keep, so from round 8 a
# young player with a real 2027 outlook earns a bonus: P(hit) × (2027 value − value of a
# round-8 pick) × surplus_weight_late. Zero before the floor: no arbitrage exists there.
keeper:
  max_keepers: 2
  cost_floor_round: 8
  surplus_weight: 0.0          # rounds 1–7 — never pulls a young player up at #49 or #65
  surplus_weight_late: 0.35    # rounds 8+
  max_speculative: 3           # hard cap on keeper-speculative roster spots (bench is 8)
  spec_threshold: 0.5          # P(hit) at/above which a round-8+ pick counts as speculative
  round8_overall_pick: 96      # what a floor-round pick is worth, as an overall ADP slot
  targets: []                  # optional: names whose P(hit) is forced to 1

# Per-manager tendencies measured from data/draft-2023.json .. draft-2025.json, keepers
# excluded (a kept RB is last season's roster decision, not a draft habit). Identity is
# joined across seasons by data/managers.csv. Three seasons is ~44 drafted picks per
# manager, so this is a nudge, not a profile: `bias` is that manager's positional share
# divided by the league mean, clamped to [0.6, 1.6], and `weight` scales how much of the
# deviation is applied. Set weight: 0 to fall back to the league-average opponent model.
manager_bias:
  weight: 1.0                  # 0 disables; 1.0 applies the observed deviation in full
  early_damp: 0.5              # multiplier before a manager's usual first round at a position
  # surplus, not all: the lean applies only to picks past a team's starter and flex slots.
  # Measured 2026-08-29 over 300 drafts, my share of simulated titles:
  #   bias off                    32.0%
  #   bias on, applied to all     31.3%   (and 24.3% with the timing damp)
  #   bias on, surplus only       37.3%
  # Scaling the starter-filling term modelled an opponent who fills needs harder, which
  # is a better drafter, not a habitual one.
  applies_to: surplus
  teams:
    "Ja'Marr & Jahmyr":            {qb: 1.09, rb: 0.98, wr: 0.88, te: 0.99, dst: 1.60, first_qb: 7, first_te: 5, first_dst: 13}
    "Lawson Country Lets Ride":    {qb: 1.04, rb: 1.07, wr: 0.96, te: 0.94, dst: 0.93, first_qb: 7, first_te: 10, first_dst: 17}
    "Patient Zeros Aids Epidemic": {qb: 0.85, rb: 1.16, wr: 1.10, te: 0.60, dst: 0.96, first_qb: 3, first_te: 8, first_dst: 13}
    "Pollock Debacle":             {qb: 0.87, rb: 0.91, wr: 0.94, te: 1.58, dst: 0.98, first_qb: 3, first_te: 7, first_dst: 17}
    "Sittin Purdy":                {qb: 1.22, rb: 0.78, wr: 1.23, te: 0.74, dst: 0.91, first_qb: 2, first_te: 9, first_dst: 15}
    "Stopped The Steal!":          {qb: 1.28, rb: 1.16, wr: 0.98, te: 0.60, dst: 0.96, first_qb: 10, first_te: 11, first_dst: 17}
    "Svannah Alley Cats":          {qb: 0.60, rb: 1.07, wr: 1.14, te: 0.94, dst: 0.93, first_qb: 12, first_te: 7, first_dst: 13}
    "The Comeback Story":          {qb: 1.04, rb: 0.93, wr: 0.96, te: 1.32, dst: 0.93, first_qb: 4, first_te: 3, first_dst: 13}
    "Time Stamps":                 {qb: 0.64, rb: 0.82, wr: 1.23, te: 1.16, dst: 0.96, first_qb: 8, first_te: 7, first_dst: 15}
    "Tom":                         {qb: 1.43, rb: 0.78, wr: 1.00, te: 1.29, dst: 0.91, first_qb: 8, first_te: 7, first_dst: 14}
    "Trash Pandas":                {qb: 1.07, rb: 1.23, wr: 0.74, te: 1.16, dst: 0.96, first_qb: 4, first_te: 5, first_dst: 14}
    "Woke Mob Warriors":           {qb: 1.04, rb: 1.13, wr: 0.84, te: 1.13, dst: 0.93, first_qb: 4, first_te: 6, first_dst: 13}

flex_policy: best_available   # RB/WR/TE by VOR — never force a position into flex
